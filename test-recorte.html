<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NØVA DISTINCT — Test Recorte + 3D desde Galería</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 22px 16px 70px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 {
      font-size: 16px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    .upload-box {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: #111111;
      border: 1px dashed #4b5563;
      color: #ffffff;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .upload-box input { display: none; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      background: #111111;
      color: #e5e7eb;
      border: 1px solid #2b2b2b;
      padding: 9px 14px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 700;
    }
    .sliders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      background: #090909;
      border: 1px solid #1f1f1f;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 11px;
      color: #d1d5db;
    }
    .sliders label {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 26px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #000000;
      border: 1px solid #1f1f1f;
      padding: 10px;
      text-align: center;
    }
    .card-title {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .card canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #000000;
    }
    .viewer-box {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000000;
      border: 1px solid #1f1f1f;
      overflow: hidden;
      margin-bottom: 14px;
      touch-action: none;
    }
    #threeContainer { width: 100%; height: 100%; }
    .viewer-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9ca3af;
      background: rgba(0, 0, 0, 0.75);
      padding: 5px 8px;
      border: 1px solid #222;
      pointer-events: none;
    }
    .viewer-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.85);
      padding: 5px;
      border: 1px solid #2b2b2b;
    }
    .hint {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NØVA DISTINCT — TEST LOCAL + 3D</h1>
    <p class="sub">Selecciona tus 4 fotos desde el móvil para probar el recorte y el 3D al instante.</p>

    <label class="upload-box">
      + Elegir fotos de mi galería (puedes marcar las 4 a la vez)
      <input id="filePicker" type="file" accept="image/*" multiple />
    </label>

    <div class="controls" id="colorButtons"></div>

    <div class="sliders">
      <label>
        <span>Corte superior (Y): <strong id="valY">13%</strong></span>
        <input id="cropY" type="range" min="5" max="25" value="13" />
      </label>
      <label>
        <span>Alto del recorte (H): <strong id="valH">73%</strong></span>
        <input id="cropH" type="range" min="55" max="85" value="73" />
      </label>
      <label>
        <span>Ancho por lado (W): <strong id="valW">48%</strong></span>
        <input id="cropW" type="range" min="35" max="50" value="48" />
      </label>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">Vista FRONT (izquierda)</div>
        <canvas id="frontCanvas"></canvas>
      </div>
      <div class="card">
        <div class="card-title">Vista BACK (derecha)</div>
        <canvas id="backCanvas"></canvas>
      </div>
    </div>

    <div class="viewer-box">
      <div class="viewer-badge" id="viewerBadge">3D VIEW // ESPERANDO FOTO</div>
      <div id="threeContainer"></div>
      <div class="viewer-bar">
        <button id="btnFront" class="active">FRONT</button>
        <button id="btnBack">BACK</button>
        <button id="btn360">360° SPIN</button>
      </div>
    </div>

    <p class="hint" id="statusText">Toca el botón de arriba y selecciona las imágenes de tus sudaderas.</p>
  </div>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let items = [];
    let currentIdx = 0;
    let loadedImg = null;

    const filePicker = document.getElementById('filePicker');
    const buttonsEl = document.getElementById('colorButtons');
    const frontCanvas = document.getElementById('frontCanvas');
    const backCanvas = document.getElementById('backCanvas');
    const statusText = document.getElementById('statusText');
    const viewerBadge = document.getElementById('viewerBadge');

    const cropYInput = document.getElementById('cropY');
    const cropHInput = document.getElementById('cropH');
    const cropWInput = document.getElementById('cropW');

    // Escena Three.js
    const container = document.getElementById('threeContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#000000');

    const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.minDistance = 2.6;
    controls.maxDistance = 5.6;

    scene.add(new THREE.AmbientLight(0xffffff, 1.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
    keyLight.position.set(2.5, 4, 4);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.9);
    backLight.position.set(-2.5, -2, -4);
    scene.add(backLight);

    const garmentGroup = new THREE.Group();
    scene.add(garmentGroup);

    function createCurvedGeometry(isBack) {
      const geo = new THREE.PlaneGeometry(2.55, 2.75, 48, 48);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const nx = x / 1.275;
        const ny = y / 1.375;
        const curve = Math.cos(nx * Math.PI * 0.45) * 0.18 + Math.cos(ny * Math.PI * 0.4) * 0.05;
        pos.setZ(i, isBack ? -curve : curve);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const frontMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0.04, bumpScale: 0.03 });
    const backMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0.04, bumpScale: 0.03 });

    const frontMesh = new THREE.Mesh(createCurvedGeometry(false), frontMat);
    frontMesh.position.z = 0.04;
    garmentGroup.add(frontMesh);

    const backMesh = new THREE.Mesh(createCurvedGeometry(true), backMat);
    backMesh.position.z = -0.04;
    backMesh.rotation.y = Math.PI;
    garmentGroup.add(backMesh);

    const coreMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(1.12, 1.18, 2.5, 24),
      new THREE.MeshStandardMaterial({ color: 0x060606, roughness: 0.95 })
    );
    coreMesh.scale.set(0.9, 0.94, 0.22);
    garmentGroup.add(coreMesh);

    let viewMode = 'FRONT';
    let targetRotationY = 0;

    const btnFront = document.getElementById('btnFront');
    const btnBack = document.getElementById('btnBack');
    const btn360 = document.getElementById('btn360');

    function setViewMode(mode) {
      viewMode = mode;
      btnFront.classList.toggle('active', mode === 'FRONT');
      btnBack.classList.toggle('active', mode === 'BACK');
      btn360.classList.toggle('active', mode === '360');
      controls.reset();
      if (mode === 'FRONT') targetRotationY = 0;
      if (mode === 'BACK') targetRotationY = Math.PI;
    }

    btnFront.onclick = () => setViewMode('FRONT');
    btnBack.onclick = () => setViewMode('BACK');
    btn360.onclick = () => setViewMode('360');

    controls.addEventListener('start', () => {
      if (viewMode === '360') {
        viewMode = 'FRONT';
        btn360.classList.remove('active');
      }
    });

    function makeBumpTexture(sourceCanvas) {
      const bCanvas = document.createElement('canvas');
      bCanvas.width = sourceCanvas.width;
      bCanvas.height = sourceCanvas.height;
      const ctx = bCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0);
      const imgData = ctx.getImageData(0, 0, bCanvas.width, bCanvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = Math.min(255, Math.max(0, (lum - 128) * 1.4 + 128));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
      return new THREE.CanvasTexture(bCanvas);
    }

    function applyTexturesTo3D() {
      const fMap = new THREE.CanvasTexture(frontCanvas);
      fMap.colorSpace = THREE.SRGBColorSpace;
      fMap.needsUpdate = true;

      const bMap = new THREE.CanvasTexture(backCanvas);
      bMap.colorSpace = THREE.SRGBColorSpace;
      bMap.needsUpdate = true;

      frontMat.map = fMap;
      frontMat.bumpMap = makeBumpTexture(frontCanvas);
      frontMat.needsUpdate = true;

      backMat.map = bMap;
      backMat.bumpMap = makeBumpTexture(backCanvas);
      backMat.needsUpdate = true;
    }

    function drawCrop(canvas, img, sx, sy, sw, sh) {
      const ctx = canvas.getContext('2d');
      canvas.width = sw;
      canvas.height = sh;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, sw, sh);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    function updateCrops() {
      const yPct = Number(cropYInput.value) / 100;
      const hPct = Number(cropHInput.value) / 100;
      const wPct = Number(cropWInput.value) / 100;

      document.getElementById('valY').textContent = `${cropYInput.value}%`;
      document.getElementById('valH').textContent = `${cropHInput.value}%`;
      document.getElementById('valW').textContent = `${cropWInput.value}%`;

      if (!loadedImg) return;

      const sy = Math.floor(loadedImg.height * yPct);
      const sh = Math.floor(loadedImg.height * hPct);
      const sw = Math.floor(loadedImg.width * wPct);

      drawCrop(frontCanvas, loadedImg, Math.floor(loadedImg.width * 0.02), sy, sw, sh);
      drawCrop(backCanvas, loadedImg, Math.floor(loadedImg.width * 0.50), sy, sw, sh);
      applyTexturesTo3D();
    }

    function loadItem(idx) {
      currentIdx = idx;
      const item = items[idx];
      if (!item) return;

      renderButtons();
      viewerBadge.textContent = `3D VIEW // ${item.label.toUpperCase()}`;

      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        statusText.textContent = `Prenda ${idx + 1}/${items.length} cargada (${img.width}x${img.height}px). Arrastra sobre el visor 3D para girar.`;
        updateCrops();
      };
      img.src = item.url;
    }

    function renderButtons() {
      buttonsEl.innerHTML = '';
      items.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.textContent = item.label;
        if (idx === currentIdx) btn.classList.add('active');
        btn.onclick = () => loadItem(idx);
        buttonsEl.appendChild(btn);
      });
    }

    filePicker.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      items = files.map((file, i) => ({
        label: `Color ${i + 1}`,
        url: URL.createObjectURL(file)
      }));
      loadItem(0);
    });

    [cropYInput, cropHInput, cropWInput].forEach((input) => {
      input.addEventListener('input', updateCrops);
    });

    window.addEventListener('resize', () => {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (viewMode === '360') {
        garmentGroup.rotation.y += delta * 0.7;
      } else {
        const diff = Math.atan2(
          Math.sin(targetRotationY - garmentGroup.rotation.y),
          Math.cos(targetRotationY - garmentGroup.rotation.y)
        );
        garmentGroup.rotation.y += diff * Math.min(1, delta * 7);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
